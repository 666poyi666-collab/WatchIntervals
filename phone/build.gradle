plugins { id 'com.android.application' }

android {
    namespace 'com.poyi.watchintervals.phone'
    compileSdk 35
    defaultConfig {
        applicationId 'com.poyi.watchintervals.phone'
        minSdk 29
        targetSdk 35
        versionCode 10
        versionName '0.10.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
