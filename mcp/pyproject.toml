[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "poyi-watch-mcp"
version = "0.20.0.dev0"
description = "Independent MCP server for WatchIntervals"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.27,<2",
  "pydantic>=2.11,<3",
  "starlette>=0.47,<2",
  "uvicorn[standard]>=0.35,<1",
  "zeroconf>=0.148,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "pyright>=1.1.403,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
poyi-watch-mcp = "watch_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watch_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["tests/test_watch_intervals_mcp.py"]

[tool.coverage.run]
branch = true
source = ["watch_mcp"]
omit = ["src/watch_mcp/main.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true
